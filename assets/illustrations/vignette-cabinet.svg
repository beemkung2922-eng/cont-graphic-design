<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <style>
      .ink-line { fill: none; stroke: #1e1b2e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #1e1b2e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .cabinet-black { fill: #121118; stroke: #121118; stroke-width: 1.2; stroke-linejoin: round; }
      .cabinet-side { fill: #2d2b38; }
      .drawer-front { fill: #1e1b2e; stroke: #1e1b2e; stroke-width: 1.2; }
      .title-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 15px; fill: #1e1b2e; text-anchor: middle; }
      .sub-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 400; font-size: 11.5px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Ground Line -->
  <line x1="45" y1="155" x2="225" y2="155" class="ink-line" />
  <circle cx="55" cy="158" r="0.8" fill="#1e1b2e" />
  <circle cx="165" cy="157" r="0.8" fill="#1e1b2e" />
  <circle cx="215" cy="158" r="0.8" fill="#1e1b2e" />

  <!-- Filing Cabinet Main Outer Shell -->
  <!-- Left Stick Arm -->
  <path d="M 88 88 C 76 86 70 98 76 108" class="ink-line" />
  <path d="M 76 108 L 86 104" class="ink-line" />

  <!-- Cabinet Body Perspective -->
  <polygon points="86,45 130,40 148,50 148,135 104,142 86,135" class="cabinet-black" />
  <!-- Side panel -->
  <polygon points="86,45 104,52 104,142 86,135" class="cabinet-side ink-line" />
  <polygon points="86,45 130,40 148,50 104,52" fill="#3b394a" class="ink-line" />

  <!-- Top Open Drawer (pulled out slightly) -->
  <polygon points="106,56 160,50 160,82 106,88" class="drawer-front ink-line" />
  <!-- Folders sticking out of Top Drawer -->
  <rect x="112" y="46" width="12" height="12" rx="1" fill="#ffffff" class="ink-thin" />
  <rect x="122" y="44" width="14" height="14" rx="1" fill="#fed7aa" class="ink-thin" />
  <rect x="134" y="48" width="12" height="10" rx="1" fill="#e9d5ff" class="ink-thin" />
  <rect x="144" y="45" width="12" height="13" rx="1" fill="#ffffff" class="ink-thin" />
  <!-- Drawer Handle / Label Tag -->
  <rect x="126" y="66" width="16" height="7" rx="1.5" fill="#ffffff" class="ink-thin" />

  <!-- Bottom Open Drawer (pulled out more) -->
  <polygon points="106,94 165,86 165,124 106,132" class="drawer-front ink-line" />
  <!-- Folders sticking out of Bottom Drawer -->
  <rect x="114" y="82" width="14" height="14" rx="1" fill="#ffffff" class="ink-thin" />
  <rect x="126" y="80" width="12" height="16" rx="1" fill="#bae6fd" class="ink-thin" />
  <rect x="136" y="84" width="16" height="12" rx="1" fill="#ffffff" class="ink-thin" />
  <!-- Standing Document being read -->
  <rect x="160" y="78" width="14" height="20" rx="1" fill="#ffffff" class="ink-line" transform="rotate(8 167 88)" />
  <line x1="163" y1="84" x2="171" y2="85" class="ink-thin" />
  <line x1="163" y1="88" x2="171" y2="89" class="ink-thin" />
  <!-- Drawer Handle / Label Tag -->
  <rect x="128" y="106" width="16" height="7" rx="1.5" fill="#ffffff" class="ink-thin" />

  <!-- Stack of Papers beside cabinet on the right -->
  <polygon points="160,118 185,118 185,145 160,145" fill="#ffffff" class="ink-line" />
  <line x1="160" y1="123" x2="185" y2="123" class="ink-thin" />
  <line x1="160" y1="128" x2="185" y2="128" class="ink-thin" />
  <line x1="160" y1="133" x2="185" y2="133" class="ink-thin" />
  <line x1="160" y1="138" x2="185" y2="138" class="ink-thin" />

  <!-- Cabinet Stick Legs -->
  <line x1="94" y1="138" x2="91" y2="155" class="ink-line" />
  <line x1="91" y1="155" x2="85" y2="155" class="ink-line" />
  <line x1="142" y1="137" x2="145" y2="155" class="ink-line" />
  <line x1="145" y1="155" x2="151" y2="155" class="ink-line" />

  <!-- Sparkles of Organization -->
  <line x1="172" y1="72" x2="176" y2="67" class="ink-thin" />
  <line x1="177" y1="74" x2="182" y2="72" class="ink-thin" />

  <!-- Labels -->
  <text x="130" y="185" class="title-text">จัดให้ชัด</text>
  <text x="130" y="204" class="sub-text">ค้นหาง่าย หยิบใช้ไว</text>
</svg>
