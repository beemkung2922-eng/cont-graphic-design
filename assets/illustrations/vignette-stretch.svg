<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="100%">
  <defs>
    <style>
      .ink-line { fill: none; stroke: #1e1b2e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #1e1b2e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .ink-dash { fill: none; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4,3; stroke-linecap: round; }
      .body-black { fill: #121118; stroke: #121118; stroke-width: 1.2; stroke-linejoin: round; }
      .eye-white { fill: #ffffff; }
      .red-note { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 13.5px; fill: #ef4444; }
      .blue-note { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 600; font-size: 12px; fill: #2563eb; }
      .title-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 14.5px; fill: #1e1b2e; text-anchor: middle; }
      .sub-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 400; font-size: 11px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Ground Line -->
  <line x1="40" y1="175" x2="340" y2="175" class="ink-line" />
  <circle cx="55" cy="178" r="0.8" fill="#1e1b2e" />
  <circle cx="70" cy="177" r="0.8" fill="#1e1b2e" />
  <circle cx="215" cy="178" r="0.8" fill="#1e1b2e" />
  <circle cx="325" cy="177" r="0.8" fill="#1e1b2e" />

  <!-- Wall Clock on the Wall -->
  <circle cx="105" cy="65" r="17" class="ink-line" fill="#ffffff" />
  <circle cx="105" cy="65" r="1.8" fill="#1e1b2e" />
  <!-- Clock Hands pointing to 3:00 / 4:00 PM -->
  <line x1="105" y1="65" x2="105" y2="54" class="ink-line" />
  <line x1="105" y1="65" x2="114" y2="65" class="ink-line" />
  <!-- Clock Hour Ticks -->
  <line x1="105" y1="50" x2="105" y2="52" class="ink-thin" />
  <line x1="120" y1="65" x2="118" y2="65" class="ink-thin" />
  <line x1="105" y1="80" x2="105" y2="78" class="ink-thin" />
  <line x1="90" y1="65" x2="92" y2="65" class="ink-thin" />

  <!-- Office Desk -->
  <line x1="50" y1="125" x2="155" y2="125" class="ink-line" />
  <line x1="55" y1="125" x2="55" y2="175" class="ink-line" />
  <line x1="148" y1="125" x2="148" y2="175" class="ink-line" />
  <!-- Desk notes hanging -->
  <rect x="65" y="130" width="10" height="12" rx="1" class="ink-thin" fill="#ffffff" />
  <rect x="80" y="130" width="10" height="12" rx="1" class="ink-thin" fill="#ffffff" />

  <!-- Laptop on Desk -->
  <line x1="72" y1="122" x2="110" y2="122" class="ink-line" />
  <path d="M 78 122 L 84 98 L 116 98 L 110 122 Z" class="ink-line" fill="#ffffff" />
  <circle cx="100" cy="110" r="2" class="ink-thin" />

  <!-- Document Stack -->
  <rect x="56" y="112" width="14" height="10" rx="1" class="ink-thin" fill="#ffffff" />
  <line x1="56" y1="116" x2="70" y2="116" class="ink-thin" />
  <line x1="56" y1="119" x2="70" y2="119" class="ink-thin" />

  <!-- Coffee Mug with Steam -->
  <rect x="122" y="110" width="11" height="12" rx="2" class="ink-line" fill="#ffffff" />
  <path d="M 133 113 C 137 113 137 119 133 119" class="ink-line" />
  <path d="M 125 106 C 127 103 125 100 127 97" class="ink-thin" />
  <path d="M 129 106 C 131 103 129 100 131 97" class="ink-thin" />

  <!-- Vacated Office Chair (Dotted Sketch) -->
  <path d="M 188 105 C 188 95 212 95 212 105 L 212 142 L 188 142 Z" class="ink-dash" />
  <line x1="184" y1="142" x2="216" y2="142" class="ink-line" />
  <line x1="200" y1="142" x2="200" y2="165" class="ink-line" />
  <line x1="188" y1="172" x2="200" y2="165" class="ink-line" />
  <line x1="212" y1="172" x2="200" y2="165" class="ink-line" />
  <circle cx="188" cy="173" r="2" fill="#1e1b2e" />
  <circle cx="212" cy="173" r="2" fill="#1e1b2e" />

  <!-- The Stretching Accordion Character -->
  <!-- Legs -->
  <line x1="174" y1="148" x2="174" y2="175" class="ink-line" />
  <line x1="174" y1="175" x2="168" y2="175" class="ink-line" />
  <line x1="186" y1="148" x2="190" y2="175" class="ink-line" />
  <line x1="190" y1="175" x2="196" y2="175" class="ink-line" />

  <!-- Zig-zag Accordion Spring Body -->
  <polygon points="175,45 190,45 196,62 170,74 196,88 168,102 196,116 168,130 192,144 172,148 158,134 186,120 158,106 186,92 158,78 184,64 165,48" class="body-black" />
  <!-- Head part of Accordion -->
  <path d="M 165 48 C 165 38 188 38 188 48 Z" class="body-black" />

  <!-- White Dot Eyes looking upward -->
  <circle cx="173" cy="45" r="2.8" class="eye-white" />
  <circle cx="173" cy="44" r="1.3" fill="#121118" />
  <circle cx="181" cy="45" r="2.8" class="eye-white" />
  <circle cx="181" cy="44" r="1.3" fill="#121118" />

  <!-- Arms Stretching High into the air -->
  <path d="M 166 48 L 155 24 L 150 20" class="ink-line" />
  <path d="M 186 48 L 200 24 L 206 20" class="ink-line" />
  <!-- Stretch energy lines -->
  <line x1="146" y1="36" x2="140" y2="34" class="ink-thin" />
  <line x1="148" y1="42" x2="142" y2="44" class="ink-thin" />
  <line x1="208" y1="36" x2="214" y2="34" class="ink-thin" />
  <line x1="206" y1="42" x2="212" y2="44" class="ink-thin" />

  <!-- Red Annotation: "ลุกพักหน่อย" + Orange Up-Arrow -->
  <text x="175" y="14" class="red-note" text-anchor="middle">ลุกพักหน่อย</text>
  <path d="M 148 65 C 144 54 146 36 150 26" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" />
  <polyline points="146,30 150,25 155,29" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Blue Annotation: "นั่งมาทั้งวัน" + Blue Curved Arrow -->
  <text x="240" y="105" class="blue-note">นั่งมาทั้งวัน</text>
  <path d="M 235 110 C 224 116 220 120 216 122" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" />
  <polyline points="220,118 215,122 219,126" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Footer Tip -->
  <text x="190" y="200" class="title-text">พักสายตาสักนิด ยืดเส้นยืดสาย 5 นาที</text>
  <text x="190" y="218" class="sub-text">นั่งหน้าจอดัดเส้นมาทั้งวัน ลุกดื่มน้ำแล้วค่อยกลับมาลุยต่อนะครับ ☕</text>
</svg>
