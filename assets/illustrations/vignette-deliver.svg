<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <style>
      .ink-line { fill: none; stroke: #1e1b2e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #1e1b2e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .trail-dot { fill: none; stroke: #f97316; stroke-width: 1.8; stroke-dasharray: 4,4; stroke-linecap: round; }
      .plane-top { fill: #ffffff; }
      .plane-under { fill: #fed7aa; }
      .plane-fold { fill: #f3f4f6; }
      .body-black { fill: #121118; stroke: #121118; stroke-width: 1; }
      .eye-white { fill: #ffffff; }
      .title-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 15px; fill: #1e1b2e; text-anchor: middle; }
      .sub-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 400; font-size: 11.5px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Flight Path Dotted Loop Trail -->
  <path d="M 45 135 C 30 135 30 115 45 115 C 60 115 62 135 85 135 C 105 135 120 120 135 110" class="trail-dot" />

  <!-- Paper Airplane -->
  <!-- Under Wing (Orange Accent) -->
  <polygon points="120,118 145,142 165,115" class="plane-under ink-line" />
  <!-- Left Wing -->
  <polygon points="215,85 85,112 145,118" class="plane-top ink-line" />
  <!-- Right Wing Fold -->
  <polygon points="215,85 145,118 185,124" class="plane-fold ink-line" />
  <!-- Center Crease -->
  <line x1="85" y1="112" x2="215" y2="85" class="ink-line" />

  <!-- Black Character (Sitting on plane, waving) -->
  <!-- Legs hanging over crease -->
  <path d="M 148 102 L 152 116 L 156 116" class="ink-line" />
  <path d="M 140 102 L 144 114 L 148 114" class="ink-line" />
  <!-- Black Body -->
  <path d="M 134 76 C 126 80 125 96 132 104 C 137 110 148 110 152 104 C 158 95 156 78 146 74 C 140 72 136 74 134 76 Z" class="body-black" />
  <!-- Eyes Looking Forward -->
  <circle cx="147" cy="84" r="2.8" class="eye-white" />
  <circle cx="148" cy="84" r="1.3" fill="#121118" />
  <circle cx="153" cy="85" r="2.4" class="eye-white" />
  <circle cx="153.5" cy="85" r="1.1" fill="#121118" />
  <!-- Left Hand holding plane -->
  <path d="M 140 92 L 138 100" class="ink-line" />
  <!-- Right Hand Waving in the Air -->
  <path d="M 150 88 L 165 72" class="ink-line" />
  <!-- Waving Motion Marks -->
  <path d="M 166 66 C 168 68 170 68 171 66" class="ink-thin" />
  <path d="M 169 70 C 171 72 173 72 174 70" class="ink-thin" />

  <!-- Wind Speed Lines behind plane -->
  <line x1="80" y1="102" x2="68" y2="100" class="ink-thin" />
  <line x1="72" y1="114" x2="62" y2="114" class="ink-thin" />

  <!-- Labels -->
  <text x="130" y="185" class="title-text">พร้อมส่งมอบ</text>
  <text x="130" y="204" class="sub-text">เปลี่ยนไอเดียเป็นงานจริง ส่งมอบตรงเวลา</text>
</svg>
