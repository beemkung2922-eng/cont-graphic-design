<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <style>
      .ink-line { fill: none; stroke: #1e1b2e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #1e1b2e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .light-glow { fill: #fef08a; opacity: 0.45; }
      .door-fill { fill: #ffffff; }
      .body-black { fill: #121118; stroke: #121118; stroke-width: 1; }
      .eye-white { fill: #ffffff; }
      .title-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 15px; fill: #1e1b2e; text-anchor: middle; }
      .sub-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 400; font-size: 11.5px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Door Frame & Warm Light -->
  <path d="M 125 155 L 125 72 A 38 38 0 0 1 201 72 L 201 155 Z" class="light-glow" />
  <path d="M 125 155 L 125 72 A 38 38 0 0 1 201 72 L 201 155" class="ink-line" />
  <path d="M 121 155 L 121 72 A 42 42 0 0 1 205 72 L 205 155" class="ink-thin" stroke-dasharray="3,3" />

  <!-- Ground Line -->
  <line x1="45" y1="155" x2="225" y2="155" class="ink-line" />
  <circle cx="58" cy="158" r="0.8" fill="#1e1b2e" />
  <circle cx="68" cy="157" r="0.8" fill="#1e1b2e" />
  <circle cx="212" cy="157" r="0.8" fill="#1e1b2e" />

  <!-- Opened Door Panel (perspective) -->
  <path d="M 148 155 L 148 56 L 182 66 L 182 165 Z" class="door-fill ink-line" />
  <!-- Door Inner Panels -->
  <rect x="154" y="74" width="20" height="34" rx="2" class="ink-thin" />
  <rect x="154" y="116" width="20" height="38" rx="2" class="ink-thin" />
  <!-- Door Knob -->
  <circle cx="178" cy="116" r="2.8" fill="#1e1b2e" />

  <!-- Black Character (Pushing the door) -->
  <!-- Left Leg -->
  <line x1="88" y1="138" x2="68" y2="155" class="ink-line" />
  <line x1="68" y1="155" x2="62" y2="155" class="ink-line" />
  <!-- Right Leg -->
  <line x1="98" y1="140" x2="94" y2="155" class="ink-line" />
  <line x1="94" y1="155" x2="99" y2="155" class="ink-line" />
  <!-- Body: Bean / Pebble Shape tilted forward -->
  <path d="M 88 98 C 76 102 74 122 84 138 C 92 148 108 144 112 134 C 118 120 114 96 100 94 C 95 93 91 95 88 98 Z" class="body-black" />
  <!-- Eyes: White dots with curious gaze into the door -->
  <ellipse cx="102" cy="107" rx="3.2" ry="4" class="eye-white" />
  <circle cx="103" cy="107" r="1.5" fill="#121118" />
  <ellipse cx="109" cy="108" rx="2.8" ry="3.5" class="eye-white" />
  <circle cx="110" cy="108" r="1.4" fill="#121118" />
  <!-- Arms Pushing -->
  <line x1="102" y1="118" x2="148" y2="114" class="ink-line" />
  <line x1="98" y1="124" x2="148" y2="120" class="ink-line" />
  <!-- Energy Sparkles -->
  <line x1="72" y1="102" x2="65" y2="98" class="ink-thin" />
  <line x1="74" y1="108" x2="68" y2="110" class="ink-thin" />

  <!-- Labels -->
  <text x="130" y="185" class="title-text">เริ่มต้นรับบรีฟ</text>
  <text x="130" y="204" class="sub-text">รวมทุกไอเดียและไฟล์ตั้งต้นไว้ที่เดียว</text>
</svg>
