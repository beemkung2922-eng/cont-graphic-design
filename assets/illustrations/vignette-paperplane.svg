<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <style>
      .ink-line { fill: none; stroke: #1e1b2e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #1e1b2e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .trail-dot { fill: none; stroke: #f97316; stroke-width: 1.8; stroke-dasharray: 4,4; stroke-linecap: round; }
      .plane-body { fill: #121118; stroke: #121118; stroke-width: 1.2; }
      .plane-wing-top { fill: #2d2b38; stroke: #1e1b2e; stroke-width: 1.6; }
      .plane-under { fill: #ffffff; stroke: #1e1b2e; stroke-width: 1.6; }
      .eye-white { fill: #ffffff; }
      .title-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 15px; fill: #1e1b2e; text-anchor: middle; }
      .sub-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 400; font-size: 11.5px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Flight Path Dotted Loop Trail (Orange) -->
  <path d="M 68 150 C 45 150 45 130 65 130 C 85 130 85 150 110 150 C 130 150 145 138 158 120" class="trail-dot" />

  <!-- Speed wind lines -->
  <line x1="68" y1="90" x2="56" y2="86" class="ink-thin" />
  <line x1="72" y1="102" x2="60" y2="100" class="ink-thin" />

  <!-- Black Origami Paper Airplane Character -->
  <!-- Under Wing (Folded perspective white/light) -->
  <polygon points="120,110 85,96 150,78" class="plane-under" />
  
  <!-- Main Black Origami Body -->
  <polygon points="215,62 85,96 160,116" class="plane-body ink-line" />
  <!-- Upper Wing Fold -->
  <polygon points="215,62 135,74 85,96" class="plane-wing-top" />
  <!-- Center Crease -->
  <line x1="85" y1="96" x2="215" y2="62" class="ink-line" />

  <!-- White Dot Eyes on the Plane Body -->
  <circle cx="178" cy="80" r="2.8" class="eye-white" />
  <circle cx="178" cy="80" r="1.3" fill="#121118" />
  <circle cx="188" cy="74" r="2.8" class="eye-white" />
  <circle cx="188" cy="74" r="1.3" fill="#121118" />

  <!-- Stick Limbs: Dangling Legs -->
  <path d="M 148 114 L 152 132 L 158 132" class="ink-line" />
  <path d="M 158 112 L 164 128 L 170 128" class="ink-line" />

  <!-- Stick Limbs: Waving Joyful Arm -->
  <path d="M 188 66 L 202 46" class="ink-line" />
  <!-- Waving Hand Finger Lines -->
  <line x1="202" y1="46" x2="201" y2="40" class="ink-thin" />
  <line x1="202" y1="46" x2="206" y2="42" class="ink-thin" />
  <line x1="202" y1="46" x2="207" y2="47" class="ink-thin" />
  <line x1="202" y1="46" x2="205" y2="50" class="ink-thin" />

  <!-- Energy marks -->
  <line x1="212" y1="38" x2="218" y2="34" class="ink-thin" />
  <line x1="217" y1="44" x2="223" y2="42" class="ink-thin" />

  <!-- Labels -->
  <text x="130" y="185" class="title-text">พร้อมส่งต่อ</text>
  <text x="130" y="204" class="sub-text">เปลี่ยนไอเดียเป็นงานจริง</text>
</svg>
