<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <style>
      .ink-line { fill: none; stroke: #1e1b2e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #1e1b2e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .box-fill { fill: #f3f4f6; }
      .folder-purple { fill: #e9d5ff; stroke: #1e1b2e; stroke-width: 1.6; }
      .folder-amber { fill: #fef08a; stroke: #1e1b2e; stroke-width: 1.6; }
      .folder-cyan { fill: #bae6fd; stroke: #1e1b2e; stroke-width: 1.6; }
      .body-black { fill: #121118; stroke: #121118; stroke-width: 1; }
      .eye-white { fill: #ffffff; }
      .title-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 15px; fill: #1e1b2e; text-anchor: middle; }
      .sub-text { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 400; font-size: 11.5px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Ground Line -->
  <line x1="45" y1="155" x2="225" y2="155" class="ink-line" />
  <circle cx="55" cy="158" r="0.8" fill="#1e1b2e" />
  <circle cx="215" cy="157" r="0.8" fill="#1e1b2e" />

  <!-- Filing Box Behind / Folders -->
  <!-- Folder 1: Purple -->
  <path d="M 85 92 L 85 80 L 105 80 L 110 86 L 140 86 L 140 108 L 85 108 Z" class="folder-purple" />
  <!-- Folder 2: Amber -->
  <path d="M 100 95 L 100 83 L 120 83 L 125 89 L 165 89 L 165 112 L 100 112 Z" class="folder-amber" />
  <!-- Folder 3: Cyan -->
  <path d="M 125 98 L 125 87 L 145 87 L 150 93 L 185 93 L 185 116 L 125 116 Z" class="folder-cyan" />

  <!-- Paper Sheets Sticking Up -->
  <rect x="145" y="74" width="22" height="32" rx="1" fill="#ffffff" class="ink-thin" transform="rotate(6 156 90)" />

  <!-- Main Filing Box Body -->
  <polygon points="75,108 195,108 195,155 75,155" class="box-fill ink-line" />
  <!-- Box Rim perspective -->
  <polygon points="75,108 85,98 205,98 195,108" fill="#e5e7eb" class="ink-line" />
  <polygon points="195,108 205,98 205,145 195,155" fill="#d1d5db" class="ink-line" />

  <!-- Box Front Label Tag -->
  <rect x="110" y="122" width="38" height="15" rx="2" fill="#ffffff" class="ink-thin" />
  <line x1="116" y1="129" x2="142" y2="129" class="ink-thin" stroke-dasharray="2,2" />

  <!-- Black Character (Sitting on edge of box holding a paper) -->
  <!-- Sitting Body -->
  <path d="M 82 86 C 74 90 72 108 78 118 C 82 124 94 124 98 118 C 104 108 102 88 94 84 C 88 82 84 84 82 86 Z" class="body-black" />
  <!-- White dot eyes looking at paper -->
  <circle cx="94" cy="94" r="2.8" class="eye-white" />
  <circle cx="95" cy="94" r="1.3" fill="#121118" />
  <circle cx="101" cy="95" r="2.4" class="eye-white" />
  <circle cx="101.5" cy="95" r="1.1" fill="#121118" />
  <!-- Dangling Stick Legs -->
  <path d="M 86 118 L 86 132 L 81 132" class="ink-line" />
  <path d="M 94 118 L 94 130 L 98 130" class="ink-line" />
  <!-- Arms holding a paper brief -->
  <path d="M 92 104 L 112 98" class="ink-line" />
  <!-- Held Sheet with sparkles -->
  <rect x="110" y="86" width="18" height="24" rx="1" fill="#ffffff" class="ink-line" transform="rotate(-10 119 98)" />
  <line x1="113" y1="92" x2="124" y2="90" class="ink-thin" />
  <line x1="114" y1="96" x2="122" y2="94" class="ink-thin" />
  <!-- Idea Sparkle -->
  <line x1="130" y1="78" x2="135" y2="72" class="ink-thin" />
  <line x1="134" y1="84" x2="140" y2="82" class="ink-thin" />

  <!-- Labels -->
  <text x="130" y="185" class="title-text">จัดระเบียบคิวงาน</text>
  <text x="130" y="204" class="sub-text">เห็นคน เห็นสถานะ ไม่ชนกัน หยิบใช้ไว</text>
</svg>
